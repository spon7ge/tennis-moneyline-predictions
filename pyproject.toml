[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tml"
version = "0.1.0"
description = "Tennis moneyline research package — P(A wins | match completes)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
test = "pytest:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
